<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Yutik</title>

<meta property="og:title" content="Yutik">
<meta property="og:description" content="Моя страница">
<meta property="og:image" content="https://yutik-ilya.github.io/image.png">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0f172a, #4c1d95);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.card {
    width: 380px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

.avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
}

h1 {
    margin: 20px 0 10px;
}

p {
    opacity: .8;
}

.button {
    display: block;
    margin-top: 15px;
    padding: 12px;
    border-radius: 15px;
    background: white;
    color: black;
    text-decoration: none;
    transition: .3s;
}

.button:hover {
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="card">

<img class="avatar" src="image.png">

<h1>Yutik</h1>

<p>Добро пожаловать ✨</p>

<a class="button" href="#">
Discord
</a>

<a class="button" href="#">
GitHub
</a>

</div>

</body>
</html>
